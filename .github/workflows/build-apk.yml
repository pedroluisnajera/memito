# Builds Memito.apk on GitHub's servers every time code is pushed to main.
# The APK is published under "Releases" so it can be downloaded from the phone.
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK (preinstalled on GitHub runners)
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME"

      - name: Install packages
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
            npx expo install expo-router react-native-screens react-native-safe-area-context expo-linking expo-constants expo-status-bar expo-notifications expo-location expo-image-picker @react-native-async-storage/async-storage @react-native-community/datetimepicker @expo/vector-icons expo-font react react-native
            npx expo install --fix
          fi

      - name: Save pinned package versions (first build only)
        run: |
          if [ -n "$(git status --porcelain package.json package-lock.json)" ]; then
            git config user.name "memito-bot"
            git config user.email "memito-bot@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "Pin package versions [skip ci]"
            git push
          fi

      - name: Check project health
        run: npx expo-doctor || true

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build APK
        working-directory: android
        # arm64 only: both target phones are 64-bit; smaller APK, faster build
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Memito.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Memito build ${{ github.run_number }}
          body: "Built from: ${{ github.event.head_commit.message }}"
          files: Memito.apk
          make_latest: true
